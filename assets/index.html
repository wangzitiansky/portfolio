<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio · 投资组合</title>
  <meta name="description" content="Personal Investment Portfolio Visualization">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="pa-app">
    <!-- Top Bar -->
    <header class="pa-header">
      <div class="pa-header__brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>PORTFOLIO</span>
      </div>
      <div class="pa-header__meta">
        <time class="pa-header__updated">数据更新于 --:--:--</time>
        <span class="pa-header__countdown">· 60s</span>
      </div>
      <div class="pa-header__actions">
        <button class="pa-btn pa-btn--icon" id="btn-refresh" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="pa-btn pa-btn--primary" id="btn-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加资产
        </button>
        <button class="pa-btn pa-btn--ghost pa-btn--sm" id="btn-import" style="color:var(--muted)">导入</button>
        <button class="pa-btn pa-btn--ghost pa-btn--sm" id="btn-export" style="color:var(--muted)">导出</button>
		<button class="pa-btn pa-btn--ghost pa-btn--sm" id="btn-record-nav" style="color:var(--muted)">记录资产</button>
      </div>
    </header>

    <!-- Hero -->
    <section class="pa-hero">
      <div class="pa-hero__subtitle">Investment Portfolio</div>
      <div class="pa-hero__total" id="hero-total">¥0</div>
      <div class="pa-hero__row">
        <div class="pa-hero__pnl" id="hero-pnl">
          <span class="pa-hero__pnl-val">+¥0</span>
          <span class="pa-hero__pnl-pct">+0.0%</span>
        </div>
        <div class="pa-hero__meta" id="hero-meta">0 Assets · 0 Indices</div>
      </div>
    </section>

    <!-- Portfolio Wheel -->
    <section class="pa-wheel-section">
      <div class="pa-chart-duo">
        <div class="pa-chart-card">
          <div class="pa-chart-card__title">资产分布 <span>按品种</span></div>
          <div class="pa-chart-wrap">
            <div class="pa-chart" id="chart-type"></div>
            <div class="pa-wheel__center" id="type-center">
              <div class="pa-wheel__center-label">总资产</div>
              <div class="pa-wheel__center-value" id="type-value">¥0</div>
            </div>
          </div>
          <div class="pa-chart-legend" id="legend-type"></div>
        </div>
        <div class="pa-chart-card">
          <div class="pa-chart-card__title">资产分布 <span>按底层指数</span></div>
          <div class="pa-chart-wrap">
            <div class="pa-chart" id="chart-index"></div>
            <div class="pa-wheel__center" id="index-center">
              <div class="pa-wheel__center-label">MY PORTFOLIO</div>
              <div class="pa-wheel__center-value" id="index-value">¥0</div>
            </div>
          </div>
          <div class="pa-chart-legend" id="legend-index"></div>
        </div>
      </div>
    </section>

    <!-- Investment Cards -->
    <section class="pa-cards-section">
      <div class="pa-cards-header">
        <h2 class="pa-cards-title">Holdings</h2>
        <span class="pa-cards-count" id="cards-count">0 Assets</span>
      </div>
      <div class="pa-cards-grid" id="cards-grid"></div>
      <div class="pa-cards-empty" id="cards-empty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="40" height="40"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <p>添加你的第一笔资产</p>
        <button class="pa-btn pa-btn--primary" id="btn-add-first">开始构建组合</button>
      </div>
    </section>

    <!-- Index Summary -->
    <section class="pa-cards-section" id="summary-section" style="display:none">
      <div class="pa-cards-header">
        <h2 class="pa-cards-title">指数汇总</h2>
        <span class="pa-cards-count" id="summary-count">0 Indices</span>
      </div>
      <div class="pa-cards-grid" id="summary-grid"></div>
    </section>

	<!-- Total Asset Trend -->
    <section class="pa-nav-section">
      <div class="pa-chart-card">
		<div class="pa-chart-card__title">总资产走势 <span>每日组合市值（含出入金影响）</span></div>
        <div class="pa-chart-wrap pa-chart-wrap--nav">
          <div class="pa-chart" id="chart-nav"></div>
        </div>
        <div class="pa-nav-empty" id="nav-empty" style="display:none">
		  <span>数据不足，至少需要 2 天的资产记录</span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="pa-footer">
      <span>数据本地存储 · Go 后端 · SQLite</span>
      <span>行情数据源 腾讯/天天基金 · 汇率 open.er-api.com</span>
    </footer>
  </div>

	<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"
	  integrity="sha384-q1KYLSKHgBnW5tWYGGR8+6YV4/iPy31dILoF2I1OD7XiVUvHEp/TaxIQVmB0j3R2" crossorigin="anonymous">
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
